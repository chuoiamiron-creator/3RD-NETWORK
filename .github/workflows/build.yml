name: Build Mod Menu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Source Code Automatically
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_source
          shopt -s dotglob
          cp -r extracted_source/*/* . 2>/dev/null || cp -r extracted_source/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;34.0.0'
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;23.1.7779620"

    - name: Set NDK Home
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
