name: Build Mod Menu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -q R3DNETWORK-main.zip -d extracted_source
        DIR=$(find extracted_source -name "build.gradle" -exec dirname {} \;)
        if [ -n "$DIR" ]; then
          cp -r "$DIR"/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;34.0.0 platform-tools'

    - name: Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;23.1.7779620"

    - name: Set NDK Home
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5.1'

    - name: Generate Fresh Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 7.5.1
        chmod +x gradlew

    - name: Build APK with Gradle Wrapper
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
