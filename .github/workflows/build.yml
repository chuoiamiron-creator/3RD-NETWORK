name: Build Mod Menu APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-33 build-tools;33.0.0'
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Accept SDK licenses and Install NDK/CMake
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"

    - name: Set NDK Home
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV

    - name: Auto Generate Gradle Wrapper and Build
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        PROJECT_DIR=$(dirname "$(find . -name "settings.gradle" -o -name "build.gradle" -print -quit)")
        cd "$PROJECT_DIR"
        if [ ! -f "gradlew" ]; then
          echo "Generating missing gradlew..."
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/'
