name: Build Mod Menu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Source Code
      run: |
        unzip -q R3DNETWORK-main.zip -d extracted_source
        TARGET_DIR=$(find extracted_source -name "build.gradle" | head -n 1 | xargs dirname)
        if [ -n "$TARGET_DIR" ]; then
          cp -r "$TARGET_DIR"/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;34.0.0'
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;23.1.7779620"

    - name: Set NDK Home
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV

    - name: Install Modern Gradle 7.5.1
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
        unzip -q gradle-7.5.1-bin.zip
        sudo mv gradle-7.5.1 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
